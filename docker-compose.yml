services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    volumes:
      - ./backend/data:/app/data
    environment:
      DATABASE_URL: sqlite:///./data/campuspulse.db
  frontend:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/workspace
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on: [api]
